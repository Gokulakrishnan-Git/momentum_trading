name: US market forward test

on:
  # Every 30 minutes during Japan/US sessions; the India open is offset by 15m.
  # The runner applies the exchange calendar and holiday/break checks.
  schedule:
    - cron: "0,30 0-6,13-21 * * 1-5"
    - cron: "15,45 3-10 * * 1-5"
  push:
    branches: [main]
    paths:
      - "forward_test.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us-market-forward-test
  cancel-in-progress: false

jobs:
  forward-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runner dependencies
        run: python -m pip install numpy pandas matplotlib seaborn requests yfinance pandas_market_calendars
      - name: Capture prices and simulate paper rebalance
        run: python forward_test.py
      - name: Persist paper portfolio and fills
        run: |
          if [[ -n "$(git status --porcelain -- forward_state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add forward_state.json
            git commit -m "Update US forward test state"
            git push
          fi
