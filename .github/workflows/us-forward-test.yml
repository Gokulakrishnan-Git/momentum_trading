name: US market forward test

on:
  # Every 5 minutes during supported exchange windows. The runner applies each
  # exchange calendar and holiday/break checks before requesting prices.
  schedule:
    - cron: "*/5 0-10,13-21 * * 1-5"
  push:
    branches: [main]
    paths:
      - "forward_test.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us-market-forward-test
  cancel-in-progress: false

jobs:
  forward-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Get market cache date
        id: market-date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .forward_market_cache
          key: forward-market-${{ runner.os }}-${{ steps.market-date.outputs.date }}
          restore-keys: |
            forward-market-${{ runner.os }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runner dependencies
        run: python -m pip install numpy pandas matplotlib seaborn requests yfinance pandas_market_calendars
      - name: Capture prices and simulate paper rebalance
        run: python forward_test.py
      - name: Persist paper portfolio and fills
        run: |
          if [[ -n "$(git status --porcelain -- forward_state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add forward_state.json
            git commit -m "Update US forward test state"
            git push
          fi
